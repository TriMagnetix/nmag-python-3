name: Diagnose Latest NumPy

on:
  push:
    branches:
      - fix/numpy-latest-typing

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Report resolved versions
        run: |
          python --version
          .venv/bin/pyright --version
          .venv/bin/python -m pip show numpy pyright h5py-stubs
          node --version || true

      - name: Build the optional Rust accelerator
        run: ./scripts/build-accelerator.sh --release

      - name: Run verification
        run: ./scripts/verify.sh
